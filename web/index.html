<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Axioma — calculadora científica multifunción, en el navegador y sin conexión.">
<meta name="theme-color" content="#11151f">
<title>Axioma</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- Safari no lee el manifiesto: sin esto, al añadir a la pantalla de inicio
     se abriría dentro del navegador y con barra de direcciones. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Axioma">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="estilo.css">

<!-- Lo primero de todo, antes de cargar nada más.
     El navegador avisa con `beforeinstallprompt` en cuanto decide que la página
     se puede instalar, y eso ocurre nada más cargarla. Si se espera a que el
     motor de cálculo esté listo —varios segundos— el aviso ya ha pasado y se
     pierde la única oportunidad de instalar con un toque. -->
<script>
  window.__peticionInstalacion = null;
  window.addEventListener("beforeinstallprompt", function (evento) {
    evento.preventDefault();
    window.__peticionInstalacion = evento;
    document.dispatchEvent(new Event("axioma:instalable"));
  });
</script>
</head>
<body>

<header class="cabecera">
  <div class="marca">
    <b>Axioma</b>
    <span class="version" id="version">calculadora científica</span>
  </div>
  <div class="acciones">
    <button id="btn-instalar" class="plano destacado" hidden>Instalar</button>
    <button id="btn-tema" class="plano" title="Cambiar entre tema claro y oscuro">◐</button>
  </div>
</header>

<!-- Menú de apartados: barra lateral en el ordenador, pestañas abajo en el móvil -->
<nav class="menu" id="menu" aria-label="Apartados"></nav>

<main class="lienzo" id="lienzo"></main>

<div class="barra" id="barra">
  <span class="simbolo">ƒ</span>
  <input id="barra-entrada" inputmode="text" autocomplete="off" autocapitalize="off"
         spellcheck="false" placeholder="Cuenta rápida:  5*sin(30)  ·  h = 2*pi*r  ·  3 km + 200 m">
  <output id="barra-resultado"></output>
  <button id="btn-variables" class="plano" title="Ver y borrar las variables definidas">x=</button>
</div>

<div class="cargando" id="cargando">
  <div class="tarjeta-carga">
    <b>Axioma</b>
    <p id="estado-carga">Preparando el motor de cálculo…</p>
    <div class="progreso"><i id="barra-progreso"></i></div>
    <small>La primera vez tarda unos segundos: se descarga Python entero.
      Después funciona sin conexión.</small>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.28.3/full/pyodide.js"
        onerror="document.getElementById('estado-carga').innerHTML =
          '<span class=&quot;error&quot;>No se pudo descargar el motor de Python. ' +
          'Compruebe la conexión y vuelva a cargar la página.</span>'"></script>
<script src="app.js"></script>
</body>
</html>
