# Publica la versión web en GitHub Pages.
#
# El núcleo se regenera aquí mismo antes de publicar: así lo que se sirve nunca
# es una copia vieja de `src/core`, aunque a alguien se le olvide ejecutar
# `python tools/preparar_web.py` antes de subir el cambio.

name: web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/core/**"
      - "tools/preparar_web.py"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Empaquetar el núcleo para el navegador
        run: python tools/preparar_web.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: despliegue
        uses: actions/deploy-pages@v4
